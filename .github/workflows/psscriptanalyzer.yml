name: PSScriptAnalyzer
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

env:
  PSSA_VERSION: '1.25.0'

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run PSScriptAnalyzer and generate SARIF
        shell: pwsh
        run: |
          $version = $env:PSSA_VERSION
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object { $_.Version -eq $version })) {
            Install-Module -Name PSScriptAnalyzer -RequiredVersion $version -Repository PSGallery -Force -Scope CurrentUser
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $version
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Settings ./PSScriptAnalyzerSettings.psd1
          $results = @()
          foreach ($f in $findings) {
            $relPath = (Resolve-Path -Relative $f.ScriptPath) -replace '^\.\\', '' -replace '\\', '/'
            $level = if ($f.Severity -eq 'Error') { 'error' } else { 'warning' }
            $results += @{
              ruleId = $f.RuleName
              level = $level
              message = @{ text = $f.Message }
              locations = @(
                @{
                  physicalLocation = @{
                    artifactLocation = @{ uri = $relPath }
                    region = @{ startLine = [Math]::Max(1, $f.Line) }
                  }
                }
              )
            }
          }
          $sarif = @{
            '$schema' = 'https://json.schemastore.org/sarif-2.1.0.json'
            version = '2.1.0'
            runs = @(
              @{
                tool = @{
                  driver = @{
                    name = 'PSScriptAnalyzer'
                    version = $version
                    informationUri = 'https://github.com/PowerShell/PSScriptAnalyzer'
                  }
                }
                results = $results
              }
            )
          }
          $sarif | ConvertTo-Json -Depth 10 | Out-File -FilePath results.sarif -Encoding utf8
          Write-Host "PSScriptAnalyzer $version found $($findings.Count) issue(s)."

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
