name: PSScriptAnalyzer
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run PSScriptAnalyzer
        uses: microsoft/psscriptanalyzer-action@3741c243734525823b5e11751e429004e85282c8 # v1.1
        with:
          path: .\
          output: results.sarif

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@2d92b76c45b91eb80fc44c74ce3fce0ee94e8f9d # v3.28.18
        with:
          sarif_file: results.sarif
