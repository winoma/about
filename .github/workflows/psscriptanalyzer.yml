name: PSScriptAnalyzer
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run PSScriptAnalyzer and generate SARIF
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser
          }
          $findings = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error,Warning
          $results = @()
          foreach ($f in $findings) {
            $relPath = (Resolve-Path -Relative $f.ScriptPath) -replace '^\.\\', '' -replace '\\', '/'
            $level = if ($f.Severity -eq 'Error') { 'error' } else { 'warning' }
            $results += @{
              ruleId = $f.RuleName
              level = $level
              message = @{ text = $f.Message }
              locations = @(
                @{
                  physicalLocation = @{
                    artifactLocation = @{ uri = $relPath }
                    region = @{ startLine = [Math]::Max(1, $f.Line) }
                  }
                }
              )
            }
          }
          $sarif = @{
            '$schema' = 'https://json.schemastore.org/sarif-2.1.0.json'
            version = '2.1.0'
            runs = @(
              @{
                tool = @{
                  driver = @{
                    name = 'PSScriptAnalyzer'
                    informationUri = 'https://github.com/PowerShell/PSScriptAnalyzer'
                  }
                }
                results = $results
              }
            )
          }
          $sarif | ConvertTo-Json -Depth 10 | Out-File -FilePath results.sarif -Encoding utf8

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@2d92b76c45b91eb80fc44c74ce3fce0ee94e8f9d # v3.28.18
        with:
          sarif_file: results.sarif
