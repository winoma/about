<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 560" width="460" height="560" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="14">
  <!-- WinOma Scan v1.2.0-beta, customer mode (phone layout). Sample values from a stock Windows 11 desktop. -->
  <defs>
    <clipPath id="typing">
      <rect x="20" y="76" height="24" width="0">
        <animate attributeName="width" values="0;0;150;150;0" keyTimes="0;0.019;0.1;0.96;1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="459" height="559" rx="12" fill="#0e0b16" stroke="#2a1f3d"/>
  <path d="M12.5 0.5 H447.5 A12 12 0 0 1 459.5 12.5 V36 H0.5 V12.5 A12 12 0 0 1 12.5 0.5 Z" fill="#171225"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="230" y="23" text-anchor="middle" fill="#8b7fa8" font-size="13">WinOma Scan</text>

  <g xml:space="preserve">
    <!-- command (two lines so it fits a phone) -->
    <text x="20" y="66" fill="#8b7fa8">PS C:\WinOma&gt;</text>
    <text x="20" y="92" fill="#e6e1f0" clip-path="url(#typing)">.\WinOma_Scan.ps1</text>

    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.125;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="20" y="120" fill="#9d6bd6">v1.2.0-beta - free PC check</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.144;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="20" y="142"><tspan fill="#b57bff" font-weight="bold">winoma &gt;&gt;</tspan><tspan fill="#e6e1f0"> Read-only. Changes nothing.</tspan></text>
    </g>

    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.175;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="20" y="170"><tspan fill="#b57bff" font-weight="bold">winoma &gt;&gt;</tspan><tspan fill="#6f6585"> Analyzing power...</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.2;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="20" y="192"><tspan fill="#b57bff" font-weight="bold">winoma &gt;&gt;</tspan><tspan fill="#6f6585"> Analyzing gaming...</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.225;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="20" y="214"><tspan fill="#b57bff" font-weight="bold">winoma &gt;&gt;</tspan><tspan fill="#6f6585"> Analyzing background...</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.25;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="20" y="236"><tspan fill="#b57bff" font-weight="bold">winoma &gt;&gt;</tspan><tspan fill="#6f6585"> Analyzing hardware...</tspan></text>
    </g>

    <!-- results by area -->
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.288;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="20" y="270" fill="#b57bff" font-weight="bold">RESULTS BY AREA</text>
      <rect x="20" y="278" width="420" height="1.5" fill="#5b2a8a"/>
    </g>

    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.313;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="20" y="302" fill="#e6e1f0">Power</text>
      <rect x="140" y="290" width="160" height="14" rx="2" fill="#2a1f3d"/>
      <rect x="140" y="290" height="14" rx="2" width="0" fill="#ff5c7a">
        <animate attributeName="width" values="0;0;72;72;0" keyTimes="0;0.313;0.344;0.96;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <text x="350" y="302" text-anchor="end" fill="#ff5c7a">45%</text>
      <text x="440" y="302" text-anchor="end" fill="#8b7fa8">4 found</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.331;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="20" y="326" fill="#e6e1f0">Gaming</text>
      <rect x="140" y="314" width="160" height="14" rx="2" fill="#2a1f3d"/>
      <rect x="140" y="314" height="14" rx="2" width="0" fill="#ffcc4d">
        <animate attributeName="width" values="0;0;82;82;0" keyTimes="0;0.331;0.363;0.96;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <text x="350" y="326" text-anchor="end" fill="#ffcc4d">51%</text>
      <text x="440" y="326" text-anchor="end" fill="#8b7fa8">4 found</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.35;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="20" y="350" fill="#e6e1f0">Background</text>
      <rect x="140" y="338" width="160" height="14" rx="2" fill="#2a1f3d"/>
      <rect x="140" y="338" height="14" rx="2" width="0" fill="#ff5c7a">
        <animate attributeName="width" values="0;0;64;64;0" keyTimes="0;0.35;0.381;0.96;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <text x="350" y="350" text-anchor="end" fill="#ff5c7a">40%</text>
      <text x="440" y="350" text-anchor="end" fill="#8b7fa8">6 found</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.369;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="20" y="374" fill="#e6e1f0">Hardware</text>
      <rect x="140" y="362" width="160" height="14" rx="2" fill="#2a1f3d"/>
      <rect x="140" y="362" height="14" rx="2" width="0" fill="#ffcc4d">
        <animate attributeName="width" values="0;0;112;112;0" keyTimes="0;0.369;0.4;0.96;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <text x="350" y="374" text-anchor="end" fill="#ffcc4d">70%</text>
      <text x="440" y="374" text-anchor="end" fill="#8b7fa8">3 found</text>
    </g>

    <!-- score -->
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.425;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="20" y="412" fill="#b57bff" font-weight="bold">SCORE</text>
      <rect x="140" y="400" width="160" height="14" rx="2" fill="#2a1f3d"/>
      <rect x="140" y="400" height="14" rx="2" width="0" fill="#ffcc4d">
        <animate attributeName="width" values="0;0;82;82;0" keyTimes="0;0.425;0.475;0.96;1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.481;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="440" y="412" text-anchor="end"><tspan fill="#ffcc4d" font-weight="bold">51/100</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.513;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="20" y="436" fill="#b57bff" font-weight="bold">TUNE-UP</text>
      <rect x="140" y="424" width="160" height="14" rx="2" fill="#2a1f3d"/>
      <rect x="140" y="424" height="14" rx="2" width="0" fill="#3ddc84">
        <animate attributeName="width" values="0;0;152;152;0" keyTimes="0;0.513;0.575;0.96;1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.581;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="440" y="436" text-anchor="end"><tspan fill="#3ddc84" font-weight="bold">95/100</tspan></text>
    </g>

    <!-- call to action -->
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.625;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="20" y="470"><tspan fill="#b57bff" font-weight="bold">winoma &gt;&gt;</tspan><tspan fill="#e6e1f0"> 17 opportunities found.</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.663;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="20" y="502"><tspan fill="#b57bff" font-weight="bold">CODE</tspan><tspan fill="#ffffff" font-weight="bold">  WS-4CTN-29B2-AHA3-H</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.7;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="20" y="534"><tspan fill="#b57bff" font-weight="bold">winoma &gt;&gt;</tspan><tspan fill="#5fd7e6"> Send it to </tspan><tspan fill="#26a5e4">t.me/omarizzww</tspan></text>
      <rect x="330" y="522" width="9" height="16" fill="#b57bff">
        <animate attributeName="opacity" calcMode="discrete" values="1;0" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
