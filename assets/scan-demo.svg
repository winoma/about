<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" width="880" height="540" font-family="JetBrains Mono, Cascadia Mono, Consolas, monospace" font-size="14">
  <!-- WinOma Scan v1.2.0-beta, customer mode. Sample values from a stock Windows 11 desktop. -->
  <defs>
    <clipPath id="typing">
      <rect x="140" y="54" height="24" width="0">
        <animate attributeName="width" values="0;0;170;170;0" keyTimes="0;0.019;0.1;0.96;1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- window -->
  <rect x="0.5" y="0.5" width="879" height="539" rx="12" fill="#0e0b16" stroke="#2a1f3d"/>
  <path d="M12.5 0.5 H867.5 A12 12 0 0 1 879.5 12.5 V36 H0.5 V12.5 A12 12 0 0 1 12.5 0.5 Z" fill="#171225"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f57"/>
  <circle cx="42" cy="18" r="6" fill="#febc2e"/>
  <circle cx="62" cy="18" r="6" fill="#28c840"/>
  <text x="440" y="23" text-anchor="middle" fill="#8b7fa8" font-size="13">WinOma Scan · PowerShell</text>

  <g xml:space="preserve">
    <!-- command -->
    <text x="24" y="70" fill="#8b7fa8">PS C:\WinOma&gt;</text>
    <text x="140" y="70" fill="#e6e1f0" clip-path="url(#typing)">.\WinOma_Scan.ps1</text>

    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.125;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="24" y="98" fill="#9d6bd6">v1.2.0-beta  -  free PC performance check</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.144;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="24" y="122"><tspan fill="#b57bff" font-weight="bold">winoma &gt;&gt;</tspan><tspan fill="#e6e1f0"> Read-only scan. Nothing on this PC is changed or sent anywhere.</tspan></text>
    </g>

    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.175;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="24" y="150"><tspan fill="#b57bff" font-weight="bold">winoma &gt;&gt;</tspan><tspan fill="#6f6585"> Analyzing power and boot...</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.2;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="24" y="172"><tspan fill="#b57bff" font-weight="bold">winoma &gt;&gt;</tspan><tspan fill="#6f6585"> Analyzing gaming and display...</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.225;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="24" y="194"><tspan fill="#b57bff" font-weight="bold">winoma &gt;&gt;</tspan><tspan fill="#6f6585"> Analyzing background load...</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.25;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="24" y="216"><tspan fill="#b57bff" font-weight="bold">winoma &gt;&gt;</tspan><tspan fill="#6f6585"> Analyzing hardware and drivers...</tspan></text>
    </g>

    <!-- results by area -->
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.288;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="24" y="250" fill="#b57bff" font-weight="bold">RESULTS BY AREA</text>
      <rect x="24" y="258" width="560" height="1.5" fill="#5b2a8a"/>
    </g>

    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.313;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="24" y="282" fill="#e6e1f0">Power and boot</text>
      <rect x="220" y="270" width="200" height="14" rx="2" fill="#2a1f3d"/>
      <rect x="220" y="270" height="14" rx="2" width="0" fill="#ff5c7a">
        <animate attributeName="width" values="0;0;90;90;0" keyTimes="0;0.313;0.344;0.96;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <text x="470" y="282" text-anchor="end" fill="#ff5c7a">45%</text>
      <text x="490" y="282" fill="#8b7fa8">4 opportunities</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.331;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="24" y="306" fill="#e6e1f0">Gaming and display</text>
      <rect x="220" y="294" width="200" height="14" rx="2" fill="#2a1f3d"/>
      <rect x="220" y="294" height="14" rx="2" width="0" fill="#ffcc4d">
        <animate attributeName="width" values="0;0;102;102;0" keyTimes="0;0.331;0.363;0.96;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <text x="470" y="306" text-anchor="end" fill="#ffcc4d">51%</text>
      <text x="490" y="306" fill="#8b7fa8">4 opportunities</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.35;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="24" y="330" fill="#e6e1f0">Background load</text>
      <rect x="220" y="318" width="200" height="14" rx="2" fill="#2a1f3d"/>
      <rect x="220" y="318" height="14" rx="2" width="0" fill="#ff5c7a">
        <animate attributeName="width" values="0;0;80;80;0" keyTimes="0;0.35;0.381;0.96;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <text x="470" y="330" text-anchor="end" fill="#ff5c7a">40%</text>
      <text x="490" y="330" fill="#8b7fa8">6 opportunities</text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.369;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="24" y="354" fill="#e6e1f0">Hardware and drivers</text>
      <rect x="220" y="342" width="200" height="14" rx="2" fill="#2a1f3d"/>
      <rect x="220" y="342" height="14" rx="2" width="0" fill="#ffcc4d">
        <animate attributeName="width" values="0;0;140;140;0" keyTimes="0;0.369;0.4;0.96;1" dur="16s" repeatCount="indefinite"/>
      </rect>
      <text x="470" y="354" text-anchor="end" fill="#ffcc4d">70%</text>
      <text x="490" y="354" fill="#8b7fa8">3 opportunities</text>
    </g>

    <!-- score -->
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.425;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="24" y="392" fill="#b57bff" font-weight="bold">SCORE</text>
      <rect x="160" y="380" width="300" height="14" rx="2" fill="#2a1f3d"/>
      <rect x="160" y="380" height="14" rx="2" width="0" fill="#ffcc4d">
        <animate attributeName="width" values="0;0;153;153;0" keyTimes="0;0.425;0.475;0.96;1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.481;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="476" y="392"><tspan fill="#ffcc4d" font-weight="bold">51/100</tspan><tspan fill="#e6e1f0">  Needs tuning</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.513;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="24" y="416" fill="#b57bff" font-weight="bold">AFTER TUNE-UP</text>
      <rect x="160" y="404" width="300" height="14" rx="2" fill="#2a1f3d"/>
      <rect x="160" y="404" height="14" rx="2" width="0" fill="#3ddc84">
        <animate attributeName="width" values="0;0;285;285;0" keyTimes="0;0.513;0.575;0.96;1" dur="16s" repeatCount="indefinite"/>
      </rect>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.581;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="476" y="416"><tspan fill="#3ddc84" font-weight="bold">95/100</tspan><tspan fill="#8b7fa8">  estimated</tspan></text>
    </g>

    <!-- call to action -->
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.625;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="24" y="452"><tspan fill="#b57bff" font-weight="bold">winoma &gt;&gt;</tspan><tspan fill="#e6e1f0"> 17 optimization opportunities found (15 fixable remotely).</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.663;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="24" y="484"><tspan fill="#b57bff" font-weight="bold">YOUR SCAN CODE</tspan><tspan fill="#ffffff" font-weight="bold">   WS-4CTN-29B2-AHA3-H</tspan><tspan fill="#6f6585">   (copied)</tspan></text>
    </g>
    <g opacity="0"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.7;0.96" dur="16s" repeatCount="indefinite"/>
      <text x="24" y="516"><tspan fill="#b57bff" font-weight="bold">winoma &gt;&gt;</tspan><tspan fill="#5fd7e6"> Send this code to t.me/omarizzww for your full report.</tspan></text>
      <rect x="547" y="504" width="9" height="16" fill="#b57bff">
        <animate attributeName="opacity" calcMode="discrete" values="1;0" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>
